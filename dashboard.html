
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Dashboard - REST API</title>

<!-- Chart.js harus dipanggil sebelum kode grafik -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    padding: 20px;
    color: #333;
}

.container {
    max-width: 1200px;
    margin: auto;
}

h1 {
    color: white;
    text-align: center;
    margin-bottom: 25px;
    font-size: 28px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 25px;
}

.card, .panel {
    background: white;
    border-radius: 15px;
    padding: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    margin-bottom: 20px;
}

.card {
    text-align: center;
}

.card .label {
    font-size: 14px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.card .value {
    font-size: 42px;
    font-weight: bold;
    margin: 10px 0;
    color: #667eea;
}

.card .unit {
    font-size: 18px;
    color: #aaa;
}

.status-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
}

.status-online {
    background: #d4edda;
    color: #155724;
}

.status-offline {
    background: #f8d7da;
    color: #721c24;
}

.panel h2, .card h2 {
    font-size: 20px;
    margin-bottom: 20px;
    color: #444;
}

/* AREA GRAFIK */
.chart-container {
    position: relative;
    width: 100%;
    height: 350px;
}

/* TOMBOL */
.controls {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.btn {
    padding: 12px 30px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

.btn-on {
    background: #28a745;
    color: white;
}

.btn-off {
    background: #dc3545;
    color: white;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    text-align: left;
    border-bottom: 1px solid #eee;
    font-size: 14px;
}

th {
    background: #f8f9fa;
    color: #666;
}

#log {
    background: #1e1e1e;
    color: #0f0;
    font-family: monospace;
    padding: 15px;
    border-radius: 10px;
    max-height: 180px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.6;
}

#log .error {
    color: #f66;
}

#log .info {
    color: #6af;
}
</style>
</head>

<body>

<div class="container">

<h1>IoT Dashboard — REST API</h1>

<!-- KARTU SENSOR -->
<div class="cards">

    <div class="card">
        <div class="label">Suhu</div>
        <div class="value" id="suhu">--</div>
        <div class="unit">°C</div>
    </div>

    <div class="card">
        <div class="label">Kelembaban</div>
        <div class="value" id="kelembaban">--</div>
        <div class="unit">%</div>
    </div>

    <div class="card">
        <div class="label">Status Sensor</div>
        <div class="value" style="font-size:22px">
            <span class="status-badge status-offline"
                  id="status-badge">OFFLINE</span>
        </div>
    </div>

</div>

<!-- GRAFIK SUHU -->
<div class="panel">
    <h2>Grafik Suhu Real-Time</h2>

    <div class="chart-container">
        <canvas id="suhuChart"></canvas>
    </div>
</div>

<!-- KONTROL PERANGKAT -->
<div class="panel">

    <h2>Kontrol Perangkat</h2>

    <div class="controls">

        <button class="btn btn-on"
                onclick="kontrol('lamp','on')">
            Nyalakan Lampu
        </button>

        <button class="btn btn-off"
                onclick="kontrol('lamp','off')">
            Matikan Lampu
        </button>

    </div>
</div>

<!-- HISTORY -->
<div class="panel">

    <h2>10 Data Sensor Terakhir</h2>

    <table>
        <thead>
            <tr>
                <th>Waktu</th>
                <th>Suhu (°C)</th>
                <th>Kelembaban (%)</th>
            </tr>
        </thead>

        <tbody id="history-body">
            <tr>
                <td colspan="3" style="text-align:center">
                    Loading...
                </td>
            </tr>
        </tbody>
    </table>

</div>

<!-- LOG AKTIVITAS -->
<div class="panel">

    <h2>Log Aktivitas</h2>
    <div id="log"></div>

</div>

</div>

<script>

// =====================================
// KONFIGURASI API
// =====================================

const API_BASE = 'http://localhost:1880/api';


// =====================================
// LOG AKTIVITAS
// =====================================

function log(msg, type = 'info') {

    const el = document.getElementById('log');
    const time = new Date().toLocaleTimeString();

    el.innerHTML +=
        `<div class="${type}">[${time}] ${msg}</div>`;

    el.scrollTop = el.scrollHeight;
}


// =====================================
// FETCH DATA SENSOR
// =====================================

async function fetchSensor() {

    try {

        const res = await fetch(`${API_BASE}/suhu`);

        if (!res.ok) {
            throw new Error('HTTP ' + res.status);
        }

        const json = await res.json();

        if (json.status === 'success' &&
            json.data &&
            json.data.suhu !== null) {

            document.getElementById('suhu').textContent =
                json.data.suhu;

            document.getElementById('kelembaban').textContent =
                json.data.kelembaban;

            const badge =
                document.getElementById('status-badge');

            badge.textContent = 'ONLINE';
            badge.className =
                'status-badge status-online';

        } else {

            document.getElementById('status-badge').textContent =
                'OFFLINE';

            document.getElementById('status-badge').className =
                'status-badge status-offline';
        }

    } catch (err) {

        log('Gagal fetch sensor: ' + err.message, 'error');

    }
}


// =====================================
// FETCH HISTORY
// =====================================

async function fetchHistory() {

    try {

        const res = await fetch(`${API_BASE}/history`);

        if (!res.ok) {
            throw new Error('HTTP ' + res.status);
        }

        const json = await res.json();

        const tbody =
            document.getElementById('history-body');

        if (!json.data || json.data.length === 0) {

            tbody.innerHTML =
                '<tr><td colspan="3">Belum ada data</td></tr>';

            return;
        }

        const rows = json.data
            .slice(-10)
            .reverse()
            .map(d => {

                const waktu = d.received || d.timestamp;

                return `
                    <tr>
                        <td>${new Date(waktu).toLocaleTimeString('id-ID')}</td>
                        <td>${d.suhu}</td>
                        <td>${d.kelembaban}</td>
                    </tr>
                `;

            }).join('');

        tbody.innerHTML = rows;

    } catch (err) {

        log('Gagal fetch history: ' + err.message, 'error');

    }
}


// =====================================
// KONTROL LAMPU (POST)
// =====================================

async function kontrol(device, action) {

    try {

        const res = await fetch(`${API_BASE}/kontrol`, {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({
                device: device,
                action: action
            })

        });

        const json = await res.json();

        if (json.status === 'success') {

            log(
                'Perintah terkirim: ' +
                device + ' → ' + action,
                'info'
            );

        } else {

            log('Gagal: ' + json.message, 'error');

        }

    } catch (err) {

        log('Error kontrol: ' + err.message, 'error');

    }
}


// =====================================
// MEMBUAT GRAFIK SUHU
// =====================================

const ctx = document.getElementById('suhuChart');

const suhuChart = new Chart(ctx, {

    type: 'line',

    data: {

        labels: [],

        datasets: [{

            label: 'Suhu (°C)',

            data: [],

            borderColor: '#ff4b4b',

            backgroundColor: 'rgba(255,75,75,0.15)',

            borderWidth: 3,

            tension: 0.3,

            fill: true,

            pointRadius: 4,

            pointBackgroundColor: '#ff4b4b'

        }]

    },

    options: {

        responsive: true,

        maintainAspectRatio: false,

        animation: false,

        scales: {

            y: {

                title: {
                    display: true,
                    text: 'Suhu (°C)'
                }

            },

            x: {

                title: {
                    display: true,
                    text: 'Waktu'
                }

            }

        }

    }

});


// =====================================
// UPDATE GRAFIK DARI NODE-RED
// =====================================

async function updateGrafik() {

    try {

        const response =
            await fetch(`${API_BASE}/history`);

        if (!response.ok) {
            throw new Error('HTTP ' + response.status);
        }

        const result = await response.json();

        const history = result.data || [];

        const data = history
            .filter(item => Number.isFinite(Number(item.suhu)))
            .slice(-20);

        suhuChart.data.labels = data.map(item => {

            const waktu = item.received || item.timestamp;

            return new Date(waktu).toLocaleTimeString('id-ID');

        });

        suhuChart.data.datasets[0].data = data.map(item =>
            Number(item.suhu)
        );

        suhuChart.update();

        console.log('Grafik diperbarui:', data.length, 'data');

    } catch (error) {

        console.error('Gagal memperbarui grafik:', error);

    }

}


// =====================================
// AUTO REFRESH
// =====================================

log('Dashboard dimulai...');

fetchSensor();
fetchHistory();
updateGrafik();

setInterval(fetchSensor, 3000);

setInterval(fetchHistory, 5000);

setInterval(updateGrafik, 3000);

</script>

</body>
</html>
